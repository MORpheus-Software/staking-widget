<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOR Staking Widget Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .container {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    h1 {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <h1>MOR Staking Widget Demo</h1>
  <p>This demo shows how to use the MOR Staking Widget in a plain HTML page.</p>
  
  <div id="staking-widget-container" class="container"></div>

  <!-- Load React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Load Ethereum and Web3 libraries -->
  <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js" type="application/javascript"></script>
  
  <!-- Load Babel for JSX support -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Load the MOR Staking Widget UMD bundle -->
  <script src="./dist/index.umd.js"></script>
  
  <!-- Demo Component -->
  <script type="text/babel">
    // Access the exported components from the UMD bundle (MORStakingWidget namespace)
    const { WalletProvider, StakingWidget } = MORStakingWidget;
    
    // Create a simple demo component
    function Demo() {
      const [status, setStatus] = React.useState('idle');
      const [message, setMessage] = React.useState('');
      
      const handleSuccess = (action, txHash) => {
        setStatus('success');
        setMessage(`${action} transaction successful! Hash: ${txHash}`);
        console.log(`${action} successful! Transaction: ${txHash}`);
      };
      
      const handleError = (error) => {
        setStatus('error');
        setMessage(`Error: ${error}`);
        console.error('Error:', error);
      };
      
      return (
        <React.Fragment>
          <WalletProvider networkType="testnet">
            <StakingWidget 
              networkType="testnet"
              defaultAmount="0.01"
              onSuccess={handleSuccess}
              onError={handleError}
            />
          </WalletProvider>
          
          {status !== 'idle' && (
            <div style={{ 
              marginTop: '20px', 
              padding: '12px', 
              borderRadius: '6px',
              backgroundColor: status === 'success' ? '#dcfce7' : '#fee2e2',
              color: status === 'success' ? '#166534' : '#b91c1c'
            }}>
              {message}
            </div>
          )}
        </React.Fragment>
      );
    }

    // Mount the component to the DOM
    const container = document.getElementById('staking-widget-container');
    const root = ReactDOM.createRoot(container);
    root.render(<Demo />);
  </script>
</body>
</html>
